[options]
isa rv32i
nret 1
solver boolector
mode bmc

[depth]
insn       15

reg        5 15
pc_fwd     5 15

unique     1 5 15
causal     5 15
causal_mem 5 15

cover      1 20

[cover]
always @* if (!reset)
    cover (channel[0].cnt_norm_insns > 0);

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[script-sources]
plugin -i slang
read_slang -DRISCV_FORMAL -DRISCV_FORMAL_NRET=1 -DRISCV_FORMAL_XLEN=32 -DRISCV_FORMAL_ILEN=32 -DRISCV_FORMAL_ALIGNED_MEM -I@basedir@/checks -F @basedir@/../riscv-pipelined-cpu/formal/rtl_files.f --top rvfi_wrapper
read_verilog -formal -overwrite @basedir@/../riscv-pipelined-cpu/formal/formal_instr_rom.v